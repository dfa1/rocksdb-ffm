name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven' # Caches ~/.m2/repository

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Cache RocksDB native builds
        uses: actions/cache@v6
        with:
          path: |
            native/osx-aarch64/src/main/resources/native
            native/linux-x86_64/src/main/resources/native
            native/linux-aarch64/src/main/resources/native
            native/windows-x86_64/src/main/resources/native
            native/windows-aarch64/src/main/resources/native
          key: rocksdb-${{ hashFiles('rocksdb/CMakeLists.txt', 'rocksdb/Makefile', 'scripts/build-rocksdb.sh', 'scripts/build-rocksdb-windows.sh') }}-${{ matrix.os }}-${{ runner.arch }}

      - name: Build macOS x86_64 native library
        if: matrix.os == 'macos-latest'
        run: ./scripts/build-rocksdb.sh "${RUNNER_TEMP}/rocksdbffm-osx-x86_64" osx-x86_64

      - name: Build and test
        run: mvn --batch-mode verify -Pall-natives

  javadoc:
    # The maven-javadoc-plugin's attach-javadocs execution (failOnError=true,
    # failOnWarnings=true — see CLAUDE.md) is only bound under the "release"
    # profile, which the build-and-test job above never activates. Without
    # this job, a Javadoc regression only surfaces the next time someone
    # actually cuts a release, months after the offending PR merged (see the
    # 0.12 CHANGELOG entry). core has no compile-scope dependency on any
    # other reactor module (native artifacts are test-scope only), so this
    # runs standalone with no native/Zig build required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Check Javadoc (same check the release build enforces)
        run: mvn --batch-mode -Prelease compile javadoc:jar -pl core
