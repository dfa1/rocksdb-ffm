name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # TEMPORARY: windows-only while investigating dfa1/rocksdb-ffm#163; restore full matrix after.
        os: [windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven' # Caches ~/.m2/repository

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Cache RocksDB native builds
        uses: actions/cache@v6
        with:
          path: |
            native/osx-aarch64/src/main/resources/native
            native/linux-x86_64/src/main/resources/native
            native/linux-aarch64/src/main/resources/native
            native/windows-x86_64/src/main/resources/native
            native/windows-aarch64/src/main/resources/native
          key: rocksdb-${{ hashFiles('rocksdb/CMakeLists.txt', 'rocksdb/Makefile', 'scripts/build-rocksdb.sh', 'scripts/build-rocksdb-windows.sh') }}-${{ matrix.os }}-${{ runner.arch }}

      - name: Build macOS x86_64 native library
        if: matrix.os == 'macos-latest'
        run: ./scripts/build-rocksdb.sh "${RUNNER_TEMP}/rocksdbffm-osx-x86_64" osx-x86_64

      - name: Build and test
        run: mvn --batch-mode verify -Pall-natives

      # TEMPORARY: capture JVM crash artifacts to root-cause the surefire 3.5.6 -> 3.6.0
      # Windows fork crash (dfa1/rocksdb-ffm#163). Remove once diagnosed.
      - name: Upload crash artifacts
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-crash-artifacts
          path: |
            **/hs_err_pid*.log
            **/target/surefire-reports/*.dump*
            **/target/surefire-reports/*.dumpstream
          if-no-files-found: warn
          retention-days: 3
