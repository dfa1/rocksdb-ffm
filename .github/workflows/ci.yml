name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  # Single pin for the whole workflow: setup-zig installs it and the native
  # cache key includes it, so a bump can't restore libraries the previous
  # Zig built. Keep in sync with REQUIRED_ZIG_MINOR in scripts/build-rocksdb*.sh.
  ZIG_VERSION: 0.17.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven' # Caches ~/.m2/repository

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      # RocksDB renumbers enums between releases (tickers inserted mid-list) and a
      # stale Java mapping silently reads the wrong value — fail the submodule bump
      # PR instead. Header-only, so one OS is enough.
      - name: Check Java enums against RocksDB headers
        if: matrix.os == 'ubuntu-latest'
        run: java scripts/CheckEnums.java

      # Same failure mode for functions: a changed c.h prototype keeps linking and
      # corrupts memory. Checks every MH_ field's `/// prototype` comment.
      - name: Check MH_ prototypes against c.h
        if: matrix.os == 'ubuntu-latest'
        run: java scripts/CheckPrototypes.java

      - name: Cache RocksDB native builds
        uses: actions/cache@v6
        with:
          path: |
            native/osx-aarch64/src/main/resources/native
            native/linux-x86_64/src/main/resources/native
            native/linux-aarch64/src/main/resources/native
            native/windows-x86_64/src/main/resources/native
            native/windows-aarch64/src/main/resources/native
          key: rocksdb-${{ hashFiles('rocksdb/CMakeLists.txt', 'rocksdb/Makefile', 'rocksdb/include/rocksdb/version.h','scripts/build-rocksdb.sh', 'scripts/build-rocksdb-windows.sh') }}-zig${{ env.ZIG_VERSION }}-${{ matrix.os }}-${{ runner.arch }}

      - name: Build and test
        run: mvn --batch-mode verify -Pall-natives

      # Catches release-smoke API drift (e.g. #see .github/smoke) at PR time instead
      # of at release time: release-smoke.yml only compiles/runs against a published
      # Central version, so a source change that breaks it isn't caught until the
      # next release. Compile-only against the local core/target/classes just built
      # above, no `mvn install` and no execution.
      - name: Compile smoke test against local build (not run)
        shell: bash
        run: |
          # core/pom.xml can't drive dependency:build-classpath standalone here: its
          # test scope declares the 5 native-* reactor siblings, which only resolve
          # inside the full reactor session that already ran above, not a fresh `mvn`
          # invocation. junit-jupiter is already on disk in ~/.m2 from that same run,
          # so just glob it by the version pinned in the root pom instead.
          JU_VERSION=$(grep -A1 '<artifactId>junit-jupiter</artifactId>' pom.xml \
            | grep -oE '<version>[^<]+</version>' | head -1 | sed -E 's/<\/?version>//g')
          # Ask Maven for its actual local repo instead of assuming $HOME/.m2 —
          # on windows-latest bash's $HOME doesn't reliably match it, which left
          # this glob matching zero jars and every JUnit import unresolved.
          M2_REPO=$(mvn -q -Dexpression=settings.localRepository help:evaluate -DforceStdout)
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          CP="core/target/classes"
          while IFS= read -r jar; do CP="$CP$SEP$jar"; done < <(find "$M2_REPO/org/junit" \
            -path "*/$JU_VERSION/*.jar" ! -name '*-sources.jar')
          mkdir -p "${RUNNER_TEMP}/smoke-classes"
          javac -cp "$CP" -d "${RUNNER_TEMP}/smoke-classes" .github/smoke/src/test/java/SmokeTest.java
