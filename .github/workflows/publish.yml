name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag) to check out and publish. Leave blank to use the ref that triggered this run.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up JDK 25 with Maven Central publishing
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # Same cache ci.yml's ubuntu-latest leg populates for this exact rocksdb
      # submodule commit; a release commit only bumps pom.xml versions, so the
      # key (keyed off rocksdb/CMakeLists.txt) matches whatever the PR/main CI
      # run already built, turning a ~15 min-per-classifier native rebuild
      # into a cache hit. Without this, publishing rebuilds RocksDB for all 5
      # classifiers from scratch on a single host — the slow build is also
      # what's suspected to have caused the v0.6 attempt's late 401 (one
      # combined upload happens only after everything else finishes, so a
      # long build means a long-lived, late network call).
      - name: Cache RocksDB native builds
        uses: actions/cache@v6
        with:
          path: |
            native/osx-aarch64/src/main/resources/native
            native/linux-x86_64/src/main/resources/native
            native/linux-aarch64/src/main/resources/native
            native/windows-x86_64/src/main/resources/native
            native/windows-aarch64/src/main/resources/native
          key: rocksdb-${{ hashFiles('rocksdb/CMakeLists.txt') }}-ubuntu-latest-${{ runner.arch }}

      - name: Publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw deploy -Prelease -DskipTests --batch-mode
