name: JDK StackWalker upcall repro (throwaway)

# Captures a REAL crash/hang for apache/maven-surefire#3459 by running this project's own
# CompactionFilterTest / CompactionFilterFactoryTest / EventNotifierTest suite under real
# surefire 3.6.0 on windows-latest -- pom.xml's stackTraceMaxFrames=0 workaround is reverted on
# this branch only (see the diff against main) so the original crash can actually happen.
#
# Five synthetic minimal reproducers (direct StackWalker, a reflective call mirroring Surefire's
# exact invocation shape, System.Logger's own internal StackWalker use, 105 concurrent
# CreateThread-spawned foreign threads, and _beginthreadex instead of CreateThread) all failed to
# reproduce the crash -- whatever the real trigger is, it depends on something in RocksDB's
# actual native thread pool this project's synthetic analogs didn't capture. This project itself,
# with real steps to reproduce, is the JDK bug report's reproducer instead.
#
# Triggers on push to this branch only -- workflow_dispatch requires the workflow file to be on
# the default branch first, which this deliberately avoids. Delete this workflow file (and the
# branch, and revert the pom.xml change) once it has run and its output has been captured for the
# JDK bug report.

on:
  push:
    branches:
      - jdk-stackwalker-repro

jobs:
  repro:
    name: real crash on windows-latest
    runs-on: windows-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"
          cache: maven

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Cache RocksDB native builds
        uses: actions/cache@v6
        with:
          path: |
            native/windows-x86_64/src/main/resources/native
          key: rocksdb-${{ hashFiles('rocksdb/CMakeLists.txt', 'rocksdb/Makefile', 'scripts/build-rocksdb.sh', 'scripts/build-rocksdb-windows.sh') }}-windows-latest-${{ runner.arch }}

      - name: Build (compile + native lib, not bounded -- a cold native build can take a while)
        run: ./mvnw --batch-mode test-compile -pl core -am

      - name: Print effective surefire config (confirm the workaround really is reverted)
        shell: bash
        run: grep -A3 stackTraceMaxFrames pom.xml || echo "stackTraceMaxFrames not present -- workaround is reverted, good"

      - name: Run the known-crashing test classes (bounded -- must not let a hang wedge the runner)
        # -am so this fresh mvn process can resolve the native module's jar: it was compiled (not
        # installed to ~/.m2, per this project's own rule) by the previous step, and each mvn
        # invocation starts a new reactor with no memory of the last one. -am redoes that
        # resolution; the actual native compile is a no-op since nothing changed.
        #
        # -Dtest applies reactor-wide with -am, including every other native/* module the reactor
        # enumerates (not just the host's own) -- none of them have a class matching this filter,
        # which trips surefire's default failIfNoSpecifiedTests before core's tests ever run.
        # failIfNoSpecifiedTests=false lets those modules report "no tests to run" instead.
        timeout-minutes: 15
        run: >-
          ./mvnw --batch-mode test -pl core -am
          "-Dtest=CompactionFilterTest,CompactionFilterFactoryTest,EventNotifierTest"
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Capture crash/report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-crash-artifacts
          path: |
            hs_err_pid*.log
            replay_pid*.log
            core/hs_err_pid*.log
            core/target/surefire-reports/**
          if-no-files-found: warn
